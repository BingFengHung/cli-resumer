[package]
name = "cli-resumer"
version = "0.1.0"
edition = "2021"
authors = ["Developer"]
description = "Auto-resume and manage recent AI CLI sessions for AGY CLI and Copilot CLI"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
inquire = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = "0.4"
walkdir = "2.4"
anyhow = "1.0"
